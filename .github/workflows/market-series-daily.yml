name: Market Series Daily Update

on:
  schedule:
    # 매일 11:10 KST (02:10 UTC)
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-series:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch market series data
        run: python3 tools/fetch_market_series.py

      - name: Sync en·zh·ja copies
        run: python3 tools/sync_market_series_locales.py

      - name: Commit and push if updated
        run: |
          FILES="data/market-series.json en/data/market-series.json zh/data/market-series.json ja/data/market-series.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No changes in market series"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(market): daily market-series update ($(date +%F))"
          git pull --rebase --autostash origin main || true
          git push
