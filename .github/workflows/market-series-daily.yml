name: Market Series Daily Update

on:
  schedule:
    # 매일 11:10 KST (02:10 UTC)
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch market series data
        run: python3 tools/fetch_market_series.py

      - name: Commit and push if updated
        run: |
          if [ -n "$(git status --porcelain data/market-series.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/market-series.json
            git commit -m "chore(market): daily market-series update"
            git push
          else
            echo "No changes in data/market-series.json"
          fi
