name: Resell Picks Sync

on:
  schedule:
    # 매일 08:30 KST (전날 23:30 UTC) — 마진 스캐너(08:00 KST)가 끝난 뒤에 돕니다.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resell-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest margin reports
        env:
          MARGIN_REPORT_TOKEN: ${{ secrets.MARGIN_REPORT_TOKEN }}
        run: |
          set -euo pipefail
          fetch() {
            local name="$1" out="$2"
            local url="https://api.github.com/repos/hoppe00lg-byte/pickle-automation/contents/reports/resell-margin/${name}?ref=main"
            if [ -n "${MARGIN_REPORT_TOKEN:-}" ]; then
              curl -fsSL --retry 3 -H "Authorization: Bearer $MARGIN_REPORT_TOKEN" \
                -H "Accept: application/vnd.github.raw" "$url" -o "$out"
            else
              curl -fsSL --retry 3 -H "Accept: application/vnd.github.raw" "$url" -o "$out"
            fi
          }
          fetch global-latest.json "$RUNNER_TEMP/global-latest.json"
          if [ ! -s "$RUNNER_TEMP/global-latest.json" ]; then
            echo "::error::직구·명품 리포트를 받지 못했습니다. MARGIN_REPORT_TOKEN Secret(비공개 저장소 읽기)을 확인하세요."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/global-latest.json'));print('직구·명품',d.get('date'),d.get('generated_at'),'항목',len(d.get('items') or []))"
          # 스니커즈(최신.json)·카드 리포트는 없을 수도 있습니다(스캔 실패·미실행). 있을 때만 씁니다.
          fetch latest.json "$RUNNER_TEMP/resell-latest.json" || echo "스니커즈 리포트 없음 — 상품 섹션은 직구 품목만"
          fetch cards-latest.json "$RUNNER_TEMP/cards-latest.json" || echo "카드 리포트 없음 — 카드 섹션은 이전 데이터 유지"

      - name: Sync resell picks into site data
        run: |
          set +e
          ARGS=""
          if [ -s "$RUNNER_TEMP/resell-latest.json" ]; then ARGS="$ARGS --report $RUNNER_TEMP/resell-latest.json"; fi
          if [ -s "$RUNNER_TEMP/cards-latest.json" ]; then
            ARGS="$ARGS --cards-report $RUNNER_TEMP/cards-latest.json"
          else
            ARGS="$ARGS --only goods,lux"
          fi
          python3 tools/sync_resell_picks.py --global-report "$RUNNER_TEMP/global-latest.json" $ARGS
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "유효 아이템 0건 — 기존 파일을 그대로 둡니다."
            exit 0
          fi
          exit "$code"

      - name: Commit and push if changed
        run: |
          FILES="data/goods-picks.json data/lux-picks.json data/cards-picks.json"
          for L in en zh ja; do
            FILES="$FILES $L/data/goods-picks.json $L/data/lux-picks.json $L/data/cards-picks.json"
          done
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(resell): 3개 섹션 실측 목록 갱신 $(date +%F)"
          git pull --rebase --autostash origin main || true
          git push
