name: Auto publish webzine (인사이트 브리프)

# 인사이트 브리프 하루 15편 자동 발행 — 피클 크레딧을 쓰지 않고 GitHub Actions(무료)에서 돈다.
#   06:30 economy · 07:30 world · 08:30 property · 09:30 economy · 10:30 ai · 11:30 energy
#   12:30 health · 13:30 fire · 14:30 trade · 15:30 culture · 16:30 ai · 17:30 economy
#   18:30 trade · 19:30 ai · 20:30 trade   (KST, tools/auto_publish_webzine.py 의 SLOTS)
# 매시 07분(UTC)에 깨어나 그때까지 밀린 슬롯을 최대 3편까지 채운다(장애로 밀린 편수도 다음 실행이 이어받는다).

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '특정 카테고리 1편만 (economy|trade|ai|fire|world|property|energy|health|culture) — 비우면 슬롯대로'
        required: false
        default: ''
      dry_run:
        description: '생성·빌드·검증만 하고 커밋하지 않음 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: auto-webzine-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AUTO_PUBLISH_MAX: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Korean fonts + Pillow (커버 카드)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Check API key
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi
          echo "GEMINI_API_KEY: length ${#GEMINI_API_KEY}"

      - name: Publish articles
        run: |
          ARGS=""
          CAT="${{ github.event.inputs.category }}"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ -n "$CAT" ]; then ARGS="$ARGS --category $CAT"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python3 tools/auto_publish_webzine.py ${ARGS}"
          python3 tools/auto_publish_webzine.py ${ARGS}

      - name: Summary
        if: always()
        run: |
          echo "### 인사이트 브리프 발행" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("data/articles.json")
          if not p.exists():
              print("articles.json 없음")
              raise SystemExit
          arts = json.loads(p.read_text(encoding="utf-8"))
          today = arts[0].get("date", "")
          rows = [a for a in arts if a.get("date") == today]
          print(f"- 오늘({today}) 기사 {len(rows)}편 / 전체 {len(arts)}편")
          for a in rows:
              print(f"  - [{a['category']}] {a['title']} — https://insightbriefnews.com/a/{a['id']}.html")
          PY
