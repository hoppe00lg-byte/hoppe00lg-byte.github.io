name: Lotto Weekly Update

on:
  schedule:
    # 매주 토요일 21:15 KST (12:15 UTC)
    - cron: '15 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest lotto draw
        run: python3 tools/fetch_lotto.py

      - name: Commit and push if updated
        run: |
          if [ -n "$(git status --porcelain data/lotto.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/lotto.json
            git commit -m "chore(lotto): update latest weekly draw"
            git push
          else
            echo "No changes in data/lotto.json"
          fi
